
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Include</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <h1>Projeto Include</h1>
        <p>Educação mais acessível para todos.</p>
    </header>

    <main>
        <h2>Bem-vindo ao Projeto Include!</h2>
        <p>Sistema de organização de alunos, turmas, cursos e frequência.</p>

        <section aria-labelledby="acessibilidade-titulo">
            <h3 id="acessibilidade-titulo">Acessibilidade</h3>

            <button type="button" id="diminuir-fonte" aria-label="Diminuir tamanho da fonte">
                A-
            </button>

            <button type="button" id="aumentar-fonte" aria-label="Aumentar tamanho da fonte">
                A+
            </button>

            <button type="button" id="restaurar-fonte">
                Restaurar
            </button>

            <p id="mensagem-acessibilidade" aria-live="polite">
                Tamanho do texto padrão.
            </p>
        </section>

        <nav aria-label="Menu principal">
            <ul>
                <li><a href="{{ url_for('alunos') }}">Alunos</a></li>
                <li><a href="#">Turmas</a></li>
                <li><a href="{{ url_for('cursos') }}">Cursos</a></li>
                <li><a href="#">Frequência</a></li>
            </ul>
        </nav>
    </main>

    <script>
        let tamanhoFonte = 16;

        const mensagem = document.getElementById("mensagem-acessibilidade");

        function atualizarFonte() {
            document.documentElement.style.fontSize = tamanhoFonte + "px";
            mensagem.textContent = "Tamanho do texto: " + tamanhoFonte + " pixels.";
        }

        document.getElementById("aumentar-fonte").addEventListener("click", function () {
            if (tamanhoFonte < 22) {
                tamanhoFonte += 2;
                atualizarFonte();
            }
        });

        document.getElementById("diminuir-fonte").addEventListener("click", function () {
            if (tamanhoFonte > 14) {
                tamanhoFonte -= 2;
                atualizarFonte();
            }
        });

        document.getElementById("restaurar-fonte").addEventListener("click", function () {
            tamanhoFonte = 16;
            atualizarFonte();
        });
    </script>
</body>
</html>
