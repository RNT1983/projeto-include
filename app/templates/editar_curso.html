
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Curso - Projeto Include</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <h1>Projeto Include</h1>
        <p>Editar Curso</p>
    </header>

    <main>
        <h2>Editar informações do curso</h2>

        <form id="form-aluno" method="POST"
              action="{{ url_for('editar_curso', id=curso.id) }}">

            <!-- Proteção CSRF -->
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label for="nome">Nome do curso *</label>
            <input type="text" id="nome" name="nome"
                   value="{{ curso.nome }}" required>

            <label for="descricao">Descrição (opcional)</label>
            <input type="text" id="descricao" name="descricao"
                   value="{{ curso.descricao or '' }}">

            <label for="carga_horaria">Carga horária em horas (opcional)</label>
            <input type="number" id="carga_horaria" name="carga_horaria"
                   min="1" value="{{ curso.carga_horaria or '' }}">

            <button type="submit">Salvar alterações</button>
        </form>

        <p>
            <a href="{{ url_for('cursos') }}">Voltar para cursos</a>
        </p>
    </main>
</body>
</html>
