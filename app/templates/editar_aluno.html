
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Aluno - Projeto Include</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <h1>Projeto Include</h1>
        <p>Editar Aluno</p>
    </header>

    <main>
        <h2>Editar informações do aluno</h2>

        <form id="form-aluno" method="POST"
              action="{{ url_for('editar_aluno', id=aluno.id) }}">

            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label for="nome">Nome do aluno *</label>
            <input type="text" id="nome" name="nome"
                   value="{{ aluno.nome }}" required>

            <label for="idade">Idade *</label>
            <input type="number" id="idade" name="idade"
                   min="1" max="120" value="{{ aluno.idade }}" required>

            <label for="responsavel">Nome do responsável *</label>
            <input type="text" id="responsavel" name="responsavel"
                   value="{{ aluno.responsavel }}" required>

            <label for="cpf">CPF (opcional)</label>
            <input type="text" id="cpf" name="cpf"
                   value="{{ aluno.cpf or '' }}"
                   placeholder="000.000.000-00">

            <label for="endereco">Endereço (opcional)</label>
            <input type="text" id="endereco" name="endereco"
                   value="{{ aluno.endereco or '' }}">

            <hr>

            <h3>Informações complementares (opcionais)</h3>
            <p>Preencha somente quando necessário e com conhecimento do responsável.</p>

            <label for="deficiencia_fisica">Possui deficiência física?</label>
            <select id="deficiencia_fisica" name="deficiencia_fisica">
                <option value="" {% if aluno.deficiencia_fisica is none %}selected{% endif %}>Não informado</option>
                <option value="sim" {% if aluno.deficiencia_fisica is sameas true %}selected{% endif %}>Sim</option>
                <option value="nao" {% if aluno.deficiencia_fisica is sameas false %}selected{% endif %}>Não</option>
            </select>

            <label for="deficiencia_intelectual">Possui deficiência intelectual?</label>
            <select id="deficiencia_intelectual" name="deficiencia_intelectual">
                <option value="" {% if aluno.deficiencia_intelectual is none %}selected{% endif %}>Não informado</option>
                <option value="sim" {% if aluno.deficiencia_intelectual is sameas true %}selected{% endif %}>Sim</option>
                <option value="nao" {% if aluno.deficiencia_intelectual is sameas false %}selected{% endif %}>Não</option>
            </select>

            <label for="tea">Possui informação de TEA?</label>
            <select id="tea" name="tea">
                <option value="" {% if aluno.tea is none %}selected{% endif %}>Não informado</option>
                <option value="sim" {% if aluno.tea is sameas true %}selected{% endif %}>Sim</option>
                <option value="nao" {% if aluno.tea is sameas false %}selected{% endif %}>Não</option>
            </select>

            <label for="recebe_beneficio">Recebe benefício social?</label>
            <select id="recebe_beneficio" name="recebe_beneficio">
                <option value="" {% if aluno.recebe_beneficio is none %}selected{% endif %}>Não informado</option>
                <option value="sim" {% if aluno.recebe_beneficio is sameas true %}selected{% endif %}>Sim</option>
                <option value="nao" {% if aluno.recebe_beneficio is sameas false %}selected{% endif %}>Não</option>
            </select>

            <label for="tipo_beneficio">Tipo de benefício (opcional)</label>
            <input type="text" id="tipo_beneficio" name="tipo_beneficio"
                   value="{{ aluno.tipo_beneficio or '' }}">

            <button type="submit">Salvar alterações</button>
        </form>

        <p>
            <a href="{{ url_for('alunos') }}">Voltar para alunos</a>
        </p>
    </main>
</body>
</html>
